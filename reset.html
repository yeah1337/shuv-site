<!doctype html>
<!--
  SHUV: the password-reset hand-off page.

  WHY THIS EXISTS. Supabase's own {{ .ConfirmationURL }} ends at
  /auth/v1/verify, which verifies the token and then redirects to the app
  with the session in the URL FRAGMENT: shuv://reset-password#access_token=…

  The fragment is the one part of a URL that does not survive that trip.
  Chrome on Android launches the custom scheme and routinely hands the app
  an intent with everything after the # already gone, so Shuv opened to a
  screen with no tokens and nothing to do. "A browser flashes, then the
  app opens, then it says the link didn't carry what we needed" is exactly
  that, and it is not a bug anyone can fix from inside the app.

  So the email stops using Supabase's link and builds its own, carrying
  {{ .TokenHash }} in the QUERY string — which does survive — to this
  page, which forwards it to the app unchanged. Shuv exchanges the hash
  for a session itself (supabase.auth.verifyOtp in app/reset-password.js).

  The page also has to work when the forward does not: a desktop browser
  has no Shuv to open, and some in-app browsers refuse custom schemes
  silently. Hence the visible fallback rather than a blank white page.

  Save to: web/reset.html
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Shuv…</title>
  <!-- A one-time link with a token in it has no business in an index. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="css/shuv.css">
  <style>
    .reset-wrap {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
      gap: 18px;
    }
    .reset-wrap img { width: 190px; height: auto; }
    .reset-note { color: var(--muted); max-width: 30em; line-height: 1.5; }
    /* Hidden until the forward has had its chance, so the usual case is a
       flash of "opening" rather than a page offering a button nobody needs. */
    #fallback { display: none; }
  </style>
</head>
<body>
<div class="page">
  <main class="reset-wrap">
    <img src="email-assets/rash-think.png" alt="Rash, thinking it over" width="190">
    <h1 class="outline" style="font-size:var(--big)">OPENING SHUV</h1>

    <div id="fallback">
      <p class="reset-note">
        If Shuv did not open by itself, tap below. If nothing happens, open this
        link on the phone that has Shuv installed.
      </p>
      <p><a class="btn jello" id="again" href="#">Open Shuv</a></p>
      <p class="reset-note">
        Reset links work once and expire after an hour. If this one has been
        used, ask for a new one from the app.
      </p>
    </div>
  </main>
</div>

<script>
  (function () {
    /* Everything Supabase put on the link, forwarded verbatim. The app
       accepts a token_hash, a code, or tokens, so nothing here needs to
       know which one turned up. */
    var query = window.location.search || '';
    var hash = window.location.hash ? window.location.hash.slice(1) : '';
    var target = 'shuv://reset-password' + query;
    /* A fragment, if one did somehow arrive, is appended as query so it
       survives the next hop too. */
    if (hash) target += (query ? '&' : '?') + hash;

    var again = document.getElementById('again');
    if (again) again.setAttribute('href', target);

    try { window.location.replace(target); } catch (e) { /* shown below */ }

    /* Still here a moment later means the hand-off did not take. */
    setTimeout(function () {
      var f = document.getElementById('fallback');
      if (f) f.style.display = 'block';
    }, 1200);
  }());
</script>
</body>
</html>
