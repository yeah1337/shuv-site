<!doctype html>
<!--
  SHUV: the "open the app" hand-off page for the streak emails.

  WHY THIS EXISTS. The three streak emails used to point their buttons
  straight at shuv://home, on the reasoning that anybody getting one has
  the app installed. That reasoning is sound and the link still does not
  work, because the mail client is between the two: Gmail rewrites every
  href through its own https tracker, and a custom scheme cannot be
  rewritten, so it ends up dead rather than redirected. Yahoo and Outlook
  strip unknown schemes outright. The button looked fine and did nothing.

  An https link survives all of that. It lands here, and here is allowed
  to send the browser on to shuv://home, because by then the mail client
  is out of the way.

  Same shape as web/reset.html, minus the token: there is nothing secret
  on this link, so it carries nothing and can be opened twice.

  Save to: web/open.html
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Shuv…</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="css/shuv.css">
  <style>
    .reset-wrap {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
      gap: 18px;
    }
    .reset-wrap img { width: 190px; height: auto; }
    .reset-note { color: var(--muted); max-width: 30em; line-height: 1.5; }
    #fallback { display: none; }
  </style>
</head>
<body>
<div class="page">
  <main class="reset-wrap">
    <img src="email-assets/rash-hero.png" alt="Rash, ready to skate" width="190">
    <h1 class="outline" style="font-size:var(--big)">OPENING SHUV</h1>

    <div id="fallback">
      <p class="reset-note">
        If Shuv did not open by itself, tap below. On a computer there is
        nothing to open: the app lives on your phone.
      </p>
      <p><a class="btn jello" id="again" href="shuv://home">Open Shuv</a></p>
      <p class="reset-note">
        No Shuv yet? <a href="/">Get it here.</a>
      </p>
    </div>
  </main>
</div>

<script>
  (function () {
    /* Any query the email appended is forwarded, so a future email can
       deep link somewhere other than home without touching this page. */
    var query = window.location.search || '';
    var to = (new URLSearchParams(query).get('to') || 'home').replace(/[^a-z-]/g, '');
    var target = 'shuv://' + (to || 'home');

    var again = document.getElementById('again');
    if (again) again.setAttribute('href', target);

    try { window.location.replace(target); } catch (e) { /* shown below */ }

    setTimeout(function () {
      var f = document.getElementById('fallback');
      if (f) f.style.display = 'block';
    }, 1200);
  }());
</script>
</body>
</html>
